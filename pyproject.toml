[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchcwt"
version = "0.1.1"
description = "Torch-native continuous wavelet transform (Morlet) via torch.fft — a pure-PyTorch replacement for fCWT"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "torchcwt contributors" },
]
keywords = [
    "cwt",
    "continuous-wavelet-transform",
    "morlet",
    "wavelet",
    "torch",
    "pytorch",
    "signal-processing",
    "fcwt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20",
    "torch>=1.12",
]

[project.urls]
Homepage = "https://github.com/noshore5/torchcwt"
Repository = "https://github.com/noshore5/torchcwt"
Issues = "https://github.com/noshore5/torchcwt/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torchcwt = ["py.typed"]
